version: "3.8"

services:
  mongo:
    image: mongo:latest
    container_name: mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    # volumes:
    #   - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/
    depends_on:
      - mongo


# docker compose -f mongo.yaml up -d
# Output:
#  ✔ Network nodeapp_default  Created                                                                                                                                
#                                           0.1s
#  ✔ Container mongo          Started                                                                                                                                
#                                           0.8s
#  ✔ Container mongo-express  Started             
#                                           0.7s   

#  mongo-express is now available at http://localhost:8081
#  mongo is now available at mongodb://root:example@localhost:27017/

#  To stop and remove the containers, run: docker compose -f mongo.yaml down

